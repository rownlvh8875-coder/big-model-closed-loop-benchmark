{
  "name": "Engine Clock Namespace Identity",
  "on": {
    "push": {
      "branches": [
        "diagnose/engine-clock-namespace-20261113-02"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "engine-clock-namespace-diagnostic-20261113-02",
    "cancel-in-progress": false
  },
  "jobs": {
    "diagnose": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "name": "Reject repeated attempts",
          "run": "test \"$GITHUB_RUN_ATTEMPT\" = 1"
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "fetch-depth": 1,
            "persist-credentials": false,
            "submodules": false,
            "lfs": false
          }
        },
        {
          "name": "Authenticate and preserve three model-free identity observations",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "/usr/bin/python3 -I -S -B scripts/engine_clock_namespace_identity.py"
        },
        {
          "name": "Preserve original bounded observations",
          "if": "${{ always() && github.run_attempt == 1 }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "engine-clock-namespace-diagnostic-20261113-02",
            "path": "output/stage7-namespace-identity/namespace-diagnostic-20261113-02/",
            "compression-level": 0,
            "retention-days": 30,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
