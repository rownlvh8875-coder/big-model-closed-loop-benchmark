name: SDK3 wide HDR input and tonemap output at step 44
on:
  push:
    branches: ['diagnostic/sdk3-wide-hdr-step44-20261122-01']
    paths: ['docs/requests/sdk3-wide-hdr-step44-20261122-01.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: stage7-official-model-execution
  cancel-in-progress: false
jobs:
  camera:
    name: Wide HDR ${{ matrix.history }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        history: [sparse, sequential]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned offline pixel readers
        run: python -m pip install --no-deps numpy==2.4.6 opencv-python-headless==5.0.0.93
      - name: Observe the bound HDR texture and final output in the native draw
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -B scripts/run_sdk3_wide_hdr.py --history '${{ matrix.history }}'
      - name: Preserve completed and failed capture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wide-hdr-step44-${{ matrix.history }}
          path: output/sdk3-wide-hdr-step44-20261122/${{ matrix.history }}/bundle/
          if-no-files-found: error
          retention-days: 30
