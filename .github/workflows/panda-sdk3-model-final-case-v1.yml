name: Complete missing SDK3 official MD-V3 condition without replaying finished cases
on:
  push:
    branches: ['diagnostic/panda-sdk3-final-condition-20261116-04']
    paths: ['docs/requests/panda-sdk3-final-condition-20261116-04.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: panda-sdk3-final-condition-20261116-04
  cancel-in-progress: false
jobs:
  sdk3-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage explicit ORT dependencies outside the frozen image
        env:
          SDK3_MODEL_DEPS: ${{ runner.temp }}/sdk3-model-deps
        run: |
          python -m pip install --no-deps --target "$SDK3_MODEL_DEPS" \
            onnxruntime==1.20.1 flatbuffers==24.3.25 coloredlogs==15.0.1 \
            humanfriendly==10.0 packaging==24.2 protobuf==5.29.5 \
            sympy==1.13.3 mpmath==1.3.0
          python -m pip freeze --path "$SDK3_MODEL_DEPS" > "$RUNNER_TEMP/sdk3-model-deps.txt"
      - name: Authenticate exact source and artifacts, then observe fresh SDK3/GLX and model cohort
        env:
          GH_TOKEN: ${{ github.token }}
          SDK3_MODEL_DEPS: ${{ runner.temp }}/sdk3-model-deps
        run: python -I -S -B scripts/continue_panda_sdk3_models.py --run
      - name: Preserve exact dependency versions
        if: always()
        run: |
          mkdir -p output/stage7-panda-sdk3-final-condition-04/producer/bundle
          cp "$RUNNER_TEMP/sdk3-model-deps.txt" output/stage7-panda-sdk3-final-condition-04/producer/bundle/ 2>/dev/null || true
      - name: Preserve positive or negative actual observations, never model weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: panda-sdk3-final-condition-20261116-04
          path: output/stage7-panda-sdk3-final-condition-04/producer/bundle/
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
          if-no-files-found: error
