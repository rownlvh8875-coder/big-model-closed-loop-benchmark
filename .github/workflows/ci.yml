name: Offline synthetic and ONNX interface CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image-boundary test dependencies
        run: python -m pip install 'numpy>=1.26' 'opencv-python-headless>=4.8'
      - name: Unit tests (ONNX Runtime native test skips if unavailable)
        run: python -m unittest discover -s tests -v
      - name: Existing mock closed-loop smoke
        run: python -m bigbench.cli smoke --scenario s_curve --out output/ci-smoke
  onnx-interface-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ONNX Runtime, ONNX model builder and image dependencies
        run: python -m pip install '.[inference]' onnx
      - name: Real ONNX Runtime inference using generated SMALL TEST GRAPH ONLY
        run: python -m unittest discover -s tests -p 'test_onnx_ort_integration.py' -v
