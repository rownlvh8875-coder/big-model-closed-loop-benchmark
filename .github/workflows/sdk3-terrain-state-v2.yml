name: Recover isolated SDK3 terrain bootstrap after authenticated zero-child failure
on:
  push:
    branches: ['diagnostic/sdk3-terrain-state-20261117-02']
    paths: ['docs/requests/sdk3-terrain-state-20261117-02.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: sdk3-terrain-state-20261117-02
  cancel-in-progress: false
jobs:
  sdk3-progress:
    name: SDK3 terrain bootstrap recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host-only image analysis dependency
        run: python -m pip install --no-deps numpy==1.26.4
      - name: Record authenticated observation, with native timeout kept explicit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -B scripts/run_sdk3_terrain_state_v2.py --run
      - name: Preserve actual progress, source images, stacks and failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk3-terrain-state-20261117-02
          path: output/stage7-sdk3-terrain-state-02/producer/bundle/
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
          if-no-files-found: error
