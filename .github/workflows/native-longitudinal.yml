name: Native MD-V3 longitudinal lead perception diagnostic (SIM ONLY)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/native-longitudinal.yml'
      - 'bigbench/native_longitudinal.py'
      - 'scripts/metadrive_longitudinal_check.py'
      - 'tests/test_native_longitudinal.py'
permissions:
  contents: read
jobs:
  native-lead-model:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYOPENGL_PLATFORM: 'glx'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install virtual display and OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa libegl1 libx11-6
      - name: Install pinned engine and ONNX inference deps
        run: python -m pip install '.[inference]' 'metadrive-simulator==0.4.3'
      - name: Verify MetaDrive official release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/metadrive-assets"
          gh release download MetaDrive-0.4.3 --repo metadriverse/metadrive --pattern assets.zip --dir "$RUNNER_TEMP/metadrive-assets"
          python - <<'PYCODE'
          import hashlib,metadrive,os
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          z=Path(os.environ['RUNNER_TEMP'])/'metadrive-assets'/'assets.zip'
          assert z.stat().st_size==134074203
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='4f0da9f5143a1258131c5b55f77bdf170c0f9bce8a9f18dd41b3678df779eac9'
          with ZipFile(z) as archive:
              for name in archive.namelist():
                  p=PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts
              archive.extractall(Path(metadrive.__file__).resolve().parent)
          print('META_043_ASSETS_VERIFIED')
          PYCODE
      - name: Download verified MD-V3 to runner temp folder
        run: |
          python -m scripts.hf_models download \
            --path '1365126a-e71e-4778-be00-8ab92dc82c09/12864/big_driving_supercombo.onnx' \
            --sha256 '35976b11be3904eb78e32f7dc55a6abf8e9433ac5aa391a1998f1e9ce001b199' \
            --max-bytes 900000000 --out "$RUNNER_TEMP/models"
      - name: Actual MD-V3 lead-braking scene diagnostic over 26 model steps
        run: |
          xvfb-run -a python -m scripts.metadrive_longitudinal_check \
            --model "$RUNNER_TEMP/models/1365126a-e71e-4778-be00-8ab92dc82c09/12864/big_driving_supercombo.onnx" \
            --spec model_specs/md-v3.json --scenario lead_brake \
            --steps 26 --seed 20261109 --out output/lead-model
          python - <<'PYCODE'
          import json
          from pathlib import Path
          d=json.loads(Path('output/lead-model/longitudinal_diagnostic.json').read_text())
          assert d['status']=='DIAGNOSTIC_EXECUTED'
          assert d['steps_completed']==26 and d['model_inference_steps']==26
          assert d['model_scoring_allowed'] is False
          assert d['plant_used'] is False
          assert d['real_vehicle_testing'] is False
          print('NATIVE_ONNX_LEAD_VISUAL_FEEDBACK_PASS',d['steps_completed'])
          PYCODE
      - name: Archive diagnostic receipts but never model weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-onnx-longitudinal-vision-diagnostic
          path: output/lead-model/
          if-no-files-found: warn
          retention-days: 7
