{
  "name": "Bounded original shader, render and RAM calls with retained host canary and ABBA",
  "on": {
    "push": {
      "branches": [
        "diagnostic/renderer-pipeline-20261114-01"
      ],
      "paths": [
        "docs/requests/renderer-pipeline-20261114-01-canary.json"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "renderer-pipeline-20261114-01",
    "cancel-in-progress": false
  },
  "jobs": {
    "native-host": {
      "name": "native-host",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 110,
      "steps": [
        {
          "name": "Reject repeated attempts",
          "env": {
            "ATTEMPT": "${{ github.run_attempt }}"
          },
          "run": "test \"$ATTEMPT\" = 1"
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "fetch-depth": 2,
            "persist-credentials": false
          }
        },
        {
          "name": "Run sealed canary C",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "/usr/bin/python3 -I -S -B scripts/renderer_pipeline_sealed_v1_run.py --canary"
        },
        {
          "name": "Upload original canary C",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "renderer-pipeline-20261114-01-canary",
            "path": "output/stage7-renderer-pipeline/renderer-pipeline-20261114-01/canary/execution/",
            "if-no-files-found": "warn",
            "compression-level": 0,
            "retention-days": 30,
            "include-hidden-files": true
          },
          "if": "always()"
        },
        {
          "name": "Wait for approved A and run ABBA",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "/usr/bin/python3 -I -S -B scripts/renderer_pipeline_sealed_v1_run.py --abba"
        },
        {
          "name": "Upload original ABBA or control failure",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "renderer-pipeline-20261114-01-abba",
            "path": "output/stage7-renderer-pipeline/renderer-pipeline-20261114-01/abba/execution/",
            "if-no-files-found": "warn",
            "compression-level": 0,
            "retention-days": 30,
            "include-hidden-files": true
          },
          "if": "always()"
        }
      ]
    },
    "canary-attestor": {
      "name": "canary-attestor",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Reject repeated attempts",
          "env": {
            "ATTEMPT": "${{ github.run_attempt }}"
          },
          "run": "test \"$ATTEMPT\" = 1"
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "fetch-depth": 2,
            "persist-credentials": false
          }
        },
        {
          "name": "Attest completed native C evidence",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "/usr/bin/python3 -I -S -B scripts/renderer_pipeline_sealed_v1_attest.py --run"
        },
        {
          "name": "Upload terminal C attestation",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "renderer-pipeline-20261114-01-canary-attestation",
            "path": "output/stage7-renderer-pipeline/renderer-pipeline-20261114-01/attestor/canary-attestation.json",
            "if-no-files-found": "warn",
            "compression-level": 0,
            "retention-days": 30,
            "include-hidden-files": true
          }
        },
        {
          "name": "Preserve attestor metadata diagnostics",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "renderer-pipeline-20261114-01-attestor-diagnostics",
            "path": "output/stage7-renderer-pipeline/renderer-pipeline-20261114-01/attestor/diagnostics/",
            "if-no-files-found": "warn",
            "compression-level": 0,
            "retention-days": 30,
            "include-hidden-files": true
          },
          "if": "always()"
        }
      ]
    }
  }
}
