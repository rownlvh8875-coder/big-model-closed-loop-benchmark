{
  "concurrency": {
    "cancel-in-progress": false,
    "group": "engine-clock-builder-20261113-01"
  },
  "jobs": {
    "prepare": {
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "name": "Reject repeated attempts",
          "run": "test \"$GITHUB_RUN_ATTEMPT\" = 1"
        },
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "fetch-depth": 1,
            "lfs": false,
            "persist-credentials": false,
            "submodules": false
          }
        },
        {
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "name": "Authenticate registered source and unique run",
          "run": "/usr/bin/python3 -I -B scripts/engine_clock_builder_preparation.py --guard-only --request docs/requests/engine-clock-builder-20261113-01.json"
        },
        {
          "name": "Prepare pinned host namespace helper",
          "run": "set -euo pipefail\nsudo apt-get update -qq\nsudo apt-get install -y --no-install-recommends bubblewrap meson ninja-build gcc pkg-config libcap-dev\nmkdir /tmp/engine-clock-bwrap-source\ncd /tmp/engine-clock-bwrap-source\ncurl --fail --silent --location --proto '=https' --max-time 60 https://github.com/containers/bubblewrap/releases/download/v0.12.0/bubblewrap-0.12.0.tar.xz --output source.tar.xz\nprintf '%s  %s\\n' 9760d007363e3abba7c747489910f9f82d9fca53ba3bd3282e396fa3c97a3314 source.tar.xz | sha256sum --check --status\ntar -xf source.tar.xz\nmeson setup build bubblewrap-0.12.0 -Dtests=false -Dman=disabled -Dselinux=disabled -Dbash_completion=disabled -Dzsh_completion=disabled\nninja -C build\nsudo install -m 0755 build/bwrap /usr/bin/bwrap\n/usr/bin/bwrap --version\nmkdir -m 0700 /tmp/engine-clock-build-builder-20261113-01\nsudo mount -t tmpfs -o size=268435456,mode=0700,uid=\"$(id -u)\",gid=\"$(id -g)\",nosuid,nodev,noexec engine-clock-builder /tmp/engine-clock-build-builder-20261113-01\n"
        },
        {
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "name": "Prepare and build offline in mandatory namespace",
          "run": "/usr/bin/python3 -I -B scripts/engine_clock_builder_preparation.py --request docs/requests/engine-clock-builder-20261113-01.json"
        },
        {
          "if": "${{ always() && github.run_attempt == 1 }}",
          "name": "Retain bounded original and partial workspaces",
          "run": "/usr/bin/python3 -I -B scripts/engine_clock_builder_retention.py --request-id builder-20261113-01"
        },
        {
          "if": "${{ always() }}",
          "name": "Retain original bounded result",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "compression-level": 0,
            "if-no-files-found": "error",
            "name": "engine-clock-builder-20261113-01",
            "path": "output/stage7-builder-preparation/builder-20261113-01/",
            "retention-days": 30
          }
        }
      ],
      "timeout-minutes": 15
    }
  },
  "name": "Engine Clock Builder Preparation",
  "on": {
    "push": {
      "branches": [
        "prepare/engine-clock-builder-20261113-01"
      ]
    }
  },
  "permissions": {
    "actions": "read",
    "contents": "read"
  }
}
