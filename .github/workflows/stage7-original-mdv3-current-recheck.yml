name: Stage7 original official MD-V3 strict native new-frame recheck current code (SIM ONLY)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stage7-original-mdv3-current-recheck.yml'
      - 'scripts/aggregate_original_mdv3_current_recheck.py'
      - 'tests/test_aggregate_original_mdv3_current_recheck.py'
permissions:
  contents: read
concurrency:
  group: original-mdv3-current-native-recheck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  official-original-mdv3-repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [20261109, 20261110]
        scenario: [s_curve_left_right, s_curve_right_left]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYOPENGL_PLATFORM: 'glx'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned MetaDrive 0.4.3 and official ONNX Runtime inference
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa libegl1 libx11-6
          python -m pip install '.[inference]' 'metadrive-simulator==0.4.3'
      - name: Verify official native MetaDrive rendering asset SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/metadrive-assets"
          gh release download MetaDrive-0.4.3 --repo metadriverse/metadrive --pattern assets.zip --dir "$RUNNER_TEMP/metadrive-assets"
          python - <<'PYCODE'
          import hashlib,metadrive,os
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          z=Path(os.environ['RUNNER_TEMP'])/'metadrive-assets'/'assets.zip'
          assert z.stat().st_size==134074203
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='4f0da9f5143a1258131c5b55f77bdf170c0f9bce8a9f18dd41b3678df779eac9'
          with ZipFile(z) as archive:
              for member in archive.namelist():
                  p=PurePosixPath(member)
                  if p.is_absolute() or '..' in p.parts:
                      raise ValueError('unsafe original MetaDrive asset entry')
              archive.extractall(Path(metadrive.__file__).resolve().parent)
          print('ORIGINAL_MDV3_METADRIVE_043_SHA256_CONFIRMED')
          PYCODE
      - name: Test independent native ONNX comparator, no pixel tolerance or replay
        run: |
          python -m unittest discover -s tests -p 'test_fresh_native_mdv3.py' -v
          python -m unittest discover -s tests -p 'test_aggregate_original_mdv3_current_recheck.py' -v
      - name: Download original official MD-V3 ONNX into ephemeral runner with exact SHA256
        run: |
          python -m scripts.hf_models download \
            --path '1365126a-e71e-4778-be00-8ab92dc82c09/12864/big_driving_supercombo.onnx' \
            --sha256 '35976b11be3904eb78e32f7dc55a6abf8e9433ac5aa391a1998f1e9ce001b199' \
            --max-bytes 900000000 --out "$RUNNER_TEMP/models"
      - name: Two completely independent original-PSSM Panda/ORT processes with a new image each step
        run: |
          set -euo pipefail
          root="output/original-mdv3-recheck/seed-${{ matrix.seed }}/${{ matrix.scenario }}"
          mkdir -p "$root"
          for idx in 0 1; do
            echo "OFFICIAL_ORIGINAL_MDV3_NATIVE_START repeat=$idx seed=${{ matrix.seed }} scene=${{ matrix.scenario }}"
            xvfb-run -a python -m scripts.native_mdv3_repeat_trial \
              --model "$RUNNER_TEMP/models/1365126a-e71e-4778-be00-8ab92dc82c09/12864/big_driving_supercombo.onnx" \
              --spec model_specs/md-v3.json \
              --scenario ${{ matrix.scenario }} \
              --seed ${{ matrix.seed }} --steps 12 --speed 8 \
              --initial-fraction 0.12 \
              --out "$root/run_${idx}.json"
          done
          python -m scripts.compare_fresh_native_mdv3 --root "$root"
      - name: Save BOTH raw source-camera and actual model feed SHA, recurrent states and strict verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-original-mdv3-${{ matrix.seed }}-${{ matrix.scenario }}
          path: output/original-mdv3-recheck/
          retention-days: 7
          if-no-files-found: warn
  independent-onnx-summary:
    needs: official-original-mdv3-repeat
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download four real original-PSSM native ONNX process-pair receipts
        uses: actions/download-artifact@v4
        with:
          pattern: stage7-original-mdv3-*
          path: output/original-mdv3-recheck/
          merge-multiple: true
      - name: Verify original model SHA/seed/PSSM and recompute strict verdict from every raw image feed
        run: |
          python -m unittest discover -s tests -p 'test_aggregate_original_mdv3_current_recheck.py' -v
          python -m scripts.aggregate_original_mdv3_current_recheck \
            --root output/original-mdv3-recheck \
            --out output/original-mdv3-recheck/original_mdv3_strict_summary.json
      - name: Preserve diagnostic success separately from strict model repeat PASS/FAIL
        uses: actions/upload-artifact@v4
        with:
          name: stage7-original-mdv3-strict-summary
          path: output/original-mdv3-recheck/original_mdv3_strict_summary.json
          if-no-files-found: error
          retention-days: 7
