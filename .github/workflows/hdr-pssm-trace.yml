name: MetaDrive 0.4.3 PSSM HDR RGB trace (SIM ONLY)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-depth-hdr-rgb:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [20261109, 20261110]
        pose: [origin, shifted]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYOPENGL_PLATFORM: 'glx'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official MetaDrive and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa libegl1 libx11-6
          python -m pip install 'numpy>=1.26,<3' 'opencv-python-headless>=4.8' 'metadrive-simulator==0.4.3'
      - name: Verify pinned official MetaDrive 0.4.3 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/md-assets"
          gh release download MetaDrive-0.4.3 --repo metadriverse/metadrive --pattern assets.zip --dir "$RUNNER_TEMP/md-assets"
          python - <<'PYCODE'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import hashlib, metadrive, os
          archive = Path(os.environ['RUNNER_TEMP']) / 'md-assets' / 'assets.zip'
          assert archive.stat().st_size == 134074203
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '4f0da9f5143a1258131c5b55f77bdf170c0f9bce8a9f18dd41b3678df779eac9'
          with ZipFile(archive) as z:
              for name in z.namelist():
                  p = PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise ValueError('unsafe MetaDrive asset entry')
              z.extractall(Path(metadrive.__file__).resolve().parent)
          print('META_ASSETS_SHA256_VERIFIED')
          PYCODE
      - name: Contract unit tests only (not native rendering proof)
        run: python -m unittest discover -s tests -p 'test_hdr_trace.py' -v
      - name: Three independent native processes, six fresh rendered camera pairs each
        run: |
          set -u
          root="output/hdr-pssm/seed-${{ matrix.seed }}-pose-${{ matrix.pose }}"
          mkdir -p "$root"
          failed=0
          for condition in baseline shadow_disabled chase_disabled; do
            echo "HDR_BEGIN seed=${{ matrix.seed }} pose=${{ matrix.pose }} $condition"
            xvfb-run -a python -m scripts.metadrive_hdr_trace \
              --seed ${{ matrix.seed }} --pose-id ${{ matrix.pose }} \
              --frames 6 --warmup 2 --ablation "$condition" \
              --out "$root/$condition.json" || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo 'NATIVE_HDR_INCONCLUSIVE_OR_ERROR; preserve JSON; do not claim PASS'
            exit 2
          fi
          python -m scripts.aggregate_hdr_trace --root "$root"
      - name: Preserve exact hashes, capture status and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hdr-pssm-seed-${{ matrix.seed }}-pose-${{ matrix.pose }}
          path: output/hdr-pssm/
          if-no-files-found: warn
          retention-days: 7
