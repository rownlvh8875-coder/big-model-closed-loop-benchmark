name: SDK3 wide camera timing at step 44
on:
  push:
    branches: ['diagnostic/sdk3-wide-step44-20261122-01']
    paths: ['docs/requests/sdk3-wide-step44-20261122-01.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: stage7-official-model-execution
  cancel-in-progress: false
jobs:
  camera:
    name: Wide capture ${{ matrix.trial }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        trial: [immediate-a, immediate-b, one-second-a, one-second-b]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned offline pixel verifier dependencies
        run: python -m pip install --no-deps numpy==2.4.6 opencv-python-headless==5.0.0.93
      - name: Capture and reverify all 46 native RGB pairs without a model
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -B scripts/run_sdk3_wide_capture.py --trial '${{ matrix.trial }}'
      - name: Preserve original successes, failures and ownership evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wide-step44-${{ matrix.trial }}
          path: output/sdk3-wide-step44-20261122/${{ matrix.trial }}/bundle/
          if-no-files-found: error
          retention-days: 30
