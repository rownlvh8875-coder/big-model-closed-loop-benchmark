name: Stage7 official MD-V3 opt-in world-frame bridge (SIM ONLY)
on:
  workflow_dispatch:
  push:
    branches: ['feat/**', 'main']
    paths:
      - 'bigbench/model_world_frame.py'
      - '.github/workflows/stage7-mdv3-world-frame.yml'
      - 'scripts/native_mdv3_world_frame.py'
      - 'tests/test_native_mdv3_world_frame.py'
permissions:
  contents: read
concurrency:
  group: stage7-mdv3-world-frame-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-world-frame-mdv3:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [20261109, 20261110]
        scenario: [s_curve_left_right, s_curve_right_left]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYOPENGL_PLATFORM: 'glx'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native renderer and parent CPU ONNX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa libegl1 libx11-6
          python -m pip install '.[inference]' 'metadrive-simulator==0.4.3' 'panda3d==1.10.13'
      - name: Run synthetic world-frame and existing exact comparator contracts
        run: |
          python -m unittest discover -s tests -p 'test_native_mdv3_world_frame.py' -v
          python -m unittest discover -s tests -p 'test_fresh_native_mdv3.py' -v
      - name: Verify official 0.4.3 rendering assets size and SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/world-frame-assets"
          gh release download MetaDrive-0.4.3 --repo metadriverse/metadrive --pattern assets.zip --dir "$RUNNER_TEMP/world-frame-assets"
          python - <<'PYCODE'
          import hashlib, os, metadrive
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive=Path(os.environ['RUNNER_TEMP'])/'world-frame-assets'/'assets.zip'
          assert archive.stat().st_size==134074203
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='4f0da9f5143a1258131c5b55f77bdf170c0f9bce8a9f18dd41b3678df779eac9'
          with ZipFile(archive) as source:
              for name in source.namelist():
                  p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise ValueError('unsafe official asset archive path')
              source.extractall(Path(metadrive.__file__).resolve().parent)
          print('WORLD_FRAME_OFFICIAL_NATIVE_ASSETS_CONFIRMED')
          PYCODE
      - name: Download official MD-V3 only into the ephemeral runner
        run: |
          python -m scripts.hf_models download \
            --path '1365126a-e71e-4778-be00-8ab92dc82c09/12864/big_driving_supercombo.onnx' \
            --sha256 '35976b11be3904eb78e32f7dc55a6abf8e9433ac5aa391a1998f1e9ce001b199' \
            --max-bytes 900000000 --out "$RUNNER_TEMP/models"
          python - <<'PYCODE'
          import os
          from pathlib import Path
          from scripts.native_mdv3_renderer_candidate import MODEL_BYTES, MODEL_SHA, SPEC_SHA
          from bigbench.onnx_contract import ModelContract
          from hashlib import sha256
          spec=Path('model_specs/md-v3.json')
          assert sha256(spec.read_bytes()).hexdigest()==SPEC_SHA
          model=Path(os.environ['RUNNER_TEMP'])/'models/1365126a-e71e-4778-be00-8ab92dc82c09/12864/big_driving_supercombo.onnx'
          assert model.stat().st_size==MODEL_BYTES==768750198
          assert ModelContract.load(spec).check_file(model)==MODEL_SHA
          print('WORLD_FRAME_OFFICIAL_MODEL_FILE_CONFIRMED_BEFORE_ORT')
          PYCODE
      - name: Two independent opt-in world-frame episodes, twelve original captures each
        run: |
          python -m scripts.native_mdv3_world_frame --mode run-case \
            --model "$RUNNER_TEMP/models/1365126a-e71e-4778-be00-8ab92dc82c09/12864/big_driving_supercombo.onnx" \
            --spec model_specs/md-v3.json --seed ${{ matrix.seed }} \
            --scene ${{ matrix.scenario }} --root output/stage7-mdv3-world-frame
      - name: Preserve raw receipts, partial failures and process logs; no model files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-mdv3-world-frame-case-${{ matrix.seed }}-${{ matrix.scenario }}
          path: output/stage7-mdv3-world-frame/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
  independent-world-frame-aggregate:
    needs: native-world-frame-mdv3
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pure receipt dependencies; no weights or inference session
        run: python -m pip install 'numpy>=1.26'
      - name: Download the four corrected-world process-pair archives
        uses: actions/download-artifact@v4
        with:
          pattern: stage7-mdv3-world-frame-case-*
          path: output/stage7-mdv3-world-frame/
          merge-multiple: true
      - name: Revalidate eight raw processes and regenerate the distinct world-frame verdict
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_native_mdv3_world_frame.py' -v
          python -m scripts.native_mdv3_world_frame --mode aggregate \
            --root output/stage7-mdv3-world-frame \
            --out output/stage7-mdv3-world-frame/aggregate_summary.json
      - name: Preserve separately labeled world-frame verdict; CI success is not gate PASS
        uses: actions/upload-artifact@v4
        with:
          name: stage7-mdv3-world-frame-summary
          path: output/stage7-mdv3-world-frame/aggregate_summary.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
