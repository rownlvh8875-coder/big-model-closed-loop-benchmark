name: Stage7 corrected-world MD-V3 bounded expansion (SIM ONLY)
on:
  workflow_dispatch:
  push:
    branches: ['feat/**']
    paths:
      - '.github/workflows/stage7-mdv3-world-frame-expansion.yml'
      - 'scripts/native_mdv3_world_frame_expansion.py'
      - 'tests/test_native_mdv3_world_frame_expansion.py'
permissions:
  contents: read
concurrency:
  group: stage7-mdv3-world-frame-expansion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-candidate-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {group: camera028, seed: 20261109, scenario: s_curve_left_right}
          - {group: camera028, seed: 20261109, scenario: s_curve_right_left}
          - {group: camera028, seed: 20261110, scenario: s_curve_left_right}
          - {group: camera028, seed: 20261110, scenario: s_curve_right_left}
          - {group: native_ramps, seed: 20261109, scenario: in_ramp}
          - {group: native_ramps, seed: 20261109, scenario: out_ramp}
          - {group: native_ramps, seed: 20261110, scenario: in_ramp}
          - {group: native_ramps, seed: 20261110, scenario: out_ramp}
          - {group: longer160, seed: 20261109, scenario: s_curve_left_right}
          - {group: longer160, seed: 20261109, scenario: s_curve_right_left}
          - {group: longer160, seed: 20261110, scenario: s_curve_left_right}
          - {group: longer160, seed: 20261110, scenario: s_curve_right_left}
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYOPENGL_PLATFORM: 'glx'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned renderer and unchanged parent CPU ONNX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa libegl1 libx11-6
          python -m pip install '.[inference]' 'metadrive-simulator==0.4.3' 'panda3d==1.10.13'
      - name: Unit corrected expansion and frozen world-frame compatibility
        run: |
          python -m unittest discover -s tests -p 'test_native_mdv3_world_frame_expansion.py' -v
          python -m unittest discover -s tests -p 'test_native_mdv3_world_frame.py' -v
      - name: Verify official native rendering assets before use
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/expansion-assets"
          gh release download MetaDrive-0.4.3 --repo metadriverse/metadrive --pattern assets.zip --dir "$RUNNER_TEMP/expansion-assets"
          python - <<'PYCODE'
          import hashlib, os, metadrive
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive=Path(os.environ['RUNNER_TEMP'])/'expansion-assets'/'assets.zip'
          assert archive.stat().st_size==134074203
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='4f0da9f5143a1258131c5b55f77bdf170c0f9bce8a9f18dd41b3678df779eac9'
          with ZipFile(archive) as source:
              for name in source.namelist():
                  p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise ValueError('unsafe official asset archive path')
              source.extractall(Path(metadrive.__file__).resolve().parent)
          print('EXPANSION_OFFICIAL_NATIVE_ASSETS_CONFIRMED')
          PYCODE
      - name: Download official MD-V3 only into the ephemeral runner
        run: |
          python -m scripts.hf_models download \
            --path '1365126a-e71e-4778-be00-8ab92dc82c09/12864/big_driving_supercombo.onnx' \
            --sha256 '35976b11be3904eb78e32f7dc55a6abf8e9433ac5aa391a1998f1e9ce001b199' \
            --max-bytes 900000000 --out "$RUNNER_TEMP/models"
          python - <<'PYCODE'
          import os
          from pathlib import Path
          from hashlib import sha256
          from scripts.native_mdv3_renderer_candidate import MODEL_BYTES, MODEL_SHA, SPEC_SHA
          from bigbench.onnx_contract import ModelContract
          spec=Path('model_specs/md-v3.json')
          assert sha256(spec.read_bytes()).hexdigest()==SPEC_SHA
          model=Path(os.environ['RUNNER_TEMP'])/'models/1365126a-e71e-4778-be00-8ab92dc82c09/12864/big_driving_supercombo.onnx'
          assert model.stat().st_size==MODEL_BYTES==768750198
          assert ModelContract.load(spec).check_file(model)==MODEL_SHA
          print('EXPANSION_OFFICIAL_MODEL_FILE_CONFIRMED_BEFORE_ORT')
          PYCODE
      - name: Collect complete-only actual-world episodes; native failure 2 stays failure
        run: |
          python -m scripts.native_mdv3_world_frame_expansion --mode run-case \
            --model "$RUNNER_TEMP/models/1365126a-e71e-4778-be00-8ab92dc82c09/12864/big_driving_supercombo.onnx" \
            --spec model_specs/md-v3.json --group ${{ matrix.group }} --seed ${{ matrix.seed }} \
            --scene ${{ matrix.scenario }} --root output/stage7-mdv3-world-frame-expansion
      - name: Preserve raw receipts, actual statuses, partial failures and logs; no weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-mdv3-world-frame-expansion-case-${{ matrix.group }}-${{ matrix.seed }}-${{ matrix.scenario }}
          path: output/stage7-mdv3-world-frame-expansion/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
  independent-expansion-aggregate:
    needs: native-candidate-expansion
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
      - name: Install pure receipt dependencies; no model or inference session
        id: receipt_deps
        run: python -m pip install 'numpy>=1.26'
      - name: Run pure receipt contracts separately from diagnostic regeneration
        id: pure_contracts
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' && steps.receipt_deps.outcome == 'success' }}
        run: python -m unittest discover -s tests -p 'test_native_mdv3_world_frame_expansion.py' -v
      - name: Download the twelve scoped case archives
        id: download_cases
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' && steps.receipt_deps.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: stage7-mdv3-world-frame-expansion-case-*
          path: output/stage7-mdv3-world-frame-expansion/
          merge-multiple: true
      - name: Regenerate complete gates and honest committed/unknown execution accounting
        id: regenerate
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success' && steps.receipt_deps.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p output/stage7-mdv3-world-frame-expansion
          python -m scripts.native_mdv3_world_frame_expansion --mode aggregate \
            --root output/stage7-mdv3-world-frame-expansion \
            --out output/stage7-mdv3-world-frame-expansion/aggregate_summary.json \
            2>&1 | tee output/stage7-mdv3-world-frame-expansion/aggregate_revalidation.log
      - name: Preserve separate expansion verdict; collection success is not gate PASS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-mdv3-world-frame-expansion-summary
          path: |
            output/stage7-mdv3-world-frame-expansion/aggregate_summary.json
            output/stage7-mdv3-world-frame-expansion/aggregate_revalidation.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
