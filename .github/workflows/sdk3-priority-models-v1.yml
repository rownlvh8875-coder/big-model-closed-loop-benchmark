name: Fresh official MD-V3 four-condition RGB terrain priority candidate
on:
  push:
    branches: ['diagnostic/sdk3-priority-models-20261117-01']
    paths: ['docs/requests/sdk3-priority-models-20261117-01.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: sdk3-priority-models-20261117-01
  cancel-in-progress: false
jobs:
  official-case:
    name: Official candidate ${{ matrix.seed }} ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [20261109, 20261110]
        scenario: [s_curve_left_right, s_curve_right_left]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host-only strict evidence readers
        run: python -m pip install --no-deps numpy==1.26.4 opencv-python-headless==4.11.0.86
      - name: Stage exact ORT dependencies outside frozen image
        env:
          SDK3_MODEL_DEPS: ${{ runner.temp }}/sdk3-priority-model-deps
        run: |
          python -m pip install --no-deps --target "$SDK3_MODEL_DEPS" \
            onnxruntime==1.20.1 flatbuffers==24.3.25 coloredlogs==15.0.1 \
            humanfriendly==10.0 packaging==24.2 protobuf==5.29.5 \
            sympy==1.13.3 mpmath==1.3.0
      - name: Authenticate source and renderer gate then run two fresh official children
        env:
          GH_TOKEN: ${{ github.token }}
          SDK3_MODEL_DEPS: ${{ runner.temp }}/sdk3-priority-model-deps
        run: python -I -B scripts/run_sdk3_priority_models.py --run --seed '${{ matrix.seed }}' --scenario '${{ matrix.scenario }}'
      - name: Retain all positive and negative evidence, never weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk3-priority-models-20261117-01-${{ matrix.seed }}-${{ matrix.scenario }}
          path: output/stage7-sdk3-priority-models-01/${{ matrix.seed }}-${{ matrix.scenario }}/producer/bundle/
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
          if-no-files-found: error
