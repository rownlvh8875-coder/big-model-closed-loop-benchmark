name: Native MetaDrive world-lane to painted-RGB reprojection (SIM ONLY)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/metadrive-lane-reprojection.yml'
      - 'bigbench/lane_reprojection.py'
      - 'scripts/metadrive_lane_audit.py'
      - 'tests/test_lane_reprojection.py'
permissions:
  contents: read
jobs:
  lane-pixel-reprojection:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYOPENGL_PLATFORM: 'glx'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Xvfb and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa libegl1 libx11-6
      - name: Install pinned MetaDrive and image dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'opencv-python-headless>=4.8' 'metadrive-simulator==0.4.3'
      - name: Prepare official 0.4.3 rendering assets (bounded, release-pinned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/metadrive-asset"
          gh release download MetaDrive-0.4.3 --repo metadriverse/metadrive --pattern assets.zip --dir "$RUNNER_TEMP/metadrive-asset"
          python - <<'PYCODE'
          import hashlib, os
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import metadrive
          archive=Path(os.environ['RUNNER_TEMP'])/'metadrive-asset'/'assets.zip'
          assert archive.stat().st_size == 134074203, 'wrong MetaDrive asset size'
          expected='4f0da9f5143a1258131c5b55f77bdf170c0f9bce8a9f18dd41b3678df779eac9'
          with archive.open('rb') as f:
              sha=hashlib.sha256(f.read()).hexdigest()
          assert sha==expected, 'wrong MetaDrive asset SHA256'
          pkg=Path(metadrive.__file__).resolve().parent
          with ZipFile(archive) as z:
              for name in z.namelist():
                  p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise ValueError('unsafe asset archive entry')
              z.extractall(pkg)
          assert (pkg/'assets'/'version.txt').is_file()
          print('METADRIVE_ASSETS_SHA256_PINNED',sha)
          PYCODE
      - name: Unit tests - independent 3D lane and RGB paint diagnostic
        run: python -m unittest discover -s tests -p 'test_lane_reprojection.py' -v
      - name: Render native MetaDrive lane pixels at two camera poses
        run: |
          xvfb-run -a python -m scripts.metadrive_lane_audit \
            --seed 20261109 --allow-inconclusive --out output/metadrive-lanes
      - name: Upload raw alignment report and predicted-vs-detected overlays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-metadrive-lane-world-to-pixel-diagnostics
          path: output/metadrive-lanes/
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce independent lane paint alignment gate
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          j=json.loads(Path('output/metadrive-lanes/lane_reprojection_report.json').read_text())
          assert j['model_score_allowed'] is False
          assert j['actual_vehicle_test'] is False
          assert j['carrot_params_or_cd210_used'] is False
          print('NATIVE_LANE_PROJECTION_RESULT',j['status'])
          if j['status']!='PASS_VIRTUAL_METADRIVE_LANE_PIXEL_ALIGNMENT_DIAGNOSTIC':
              raise SystemExit('Native lane paint alignment is NOT independently verified; inspect artifact')
          PYCODE
