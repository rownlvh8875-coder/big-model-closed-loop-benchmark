name: Diagnose SDK3 full-episode RGB with an uninstrumented control
on:
  push:
    branches: ['diagnostic/sdk3-rgb-forensics-20261116-01']
    paths: ['docs/requests/sdk3-rgb-forensics-20261116-01.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: sdk3-rgb-forensics-20261116-01
  cancel-in-progress: false
jobs:
  sdk3-runtime:
    name: SDK3 RGB ${{ matrix.arm }}
    strategy:
      fail-fast: false
      matrix:
        arm: [control, full_rgb]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host-only pixel analysis dependency
        run: python -m pip install --no-deps numpy==1.26.4
      - name: Stage explicit ORT dependencies outside the frozen image
        env:
          SDK3_MODEL_DEPS: ${{ runner.temp }}/sdk3-model-deps
        run: |
          python -m pip install --no-deps --target "$SDK3_MODEL_DEPS" \
            onnxruntime==1.20.1 flatbuffers==24.3.25 coloredlogs==15.0.1 \
            humanfriendly==10.0 packaging==24.2 protobuf==5.29.5 \
            sympy==1.13.3 mpmath==1.3.0
          python -m pip freeze --path "$SDK3_MODEL_DEPS" > "$RUNNER_TEMP/sdk3-model-deps.txt"
      - name: Authenticate frozen inputs and execute one control or full-RGB model pair
        env:
          GH_TOKEN: ${{ github.token }}
          SDK3_MODEL_DEPS: ${{ runner.temp }}/sdk3-model-deps
        run: python -I -B scripts/run_sdk3_rgb_forensics.py --run --arm "${{ matrix.arm }}"
      - name: Preserve exact dependency versions
        if: always()
        run: |
          mkdir -p output/stage7-sdk3-rgb-forensics-01/${{ matrix.arm }}/producer/bundle
          cp "$RUNNER_TEMP/sdk3-model-deps.txt" output/stage7-sdk3-rgb-forensics-01/${{ matrix.arm }}/producer/bundle/ 2>/dev/null || true
      - name: Preserve positive or negative actual observations, never model weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk3-rgb-forensics-20261116-01-${{ matrix.arm }}
          path: output/stage7-sdk3-rgb-forensics-01/${{ matrix.arm }}/producer/bundle/
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
          if-no-files-found: error
