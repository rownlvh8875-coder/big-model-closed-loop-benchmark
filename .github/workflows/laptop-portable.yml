name: Windows portable laptop contracts (no GPU or model qualification)
on:
  push:
    branches: [feature/sdk3-four-validation-v1, feature/windows-msaa-host-v1, feature/windows-camera-probe-v1, feature/cloud-input-and-windows-worker-v1, feature/full-s-failure-capture-v1]
  pull_request:
permissions:
  contents: read
jobs:
  windows-contracts:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only CPU image readers, no Panda, CARLA or ONNX runtime
        run: python -m pip install --no-deps numpy==2.4.6 opencv-python-headless==5.0.0.93
      - name: Test portable contracts and cold entry points
        run: python -B -m unittest tests.test_laptop_gpu_validation tests.test_laptop_gpu_host_allocation tests.test_laptop_review_regressions tests.test_laptop_validation tests.test_offline_camera_validation tests.test_carla_validation tests.test_full_s_receipts tests.test_full_s_validation tests.test_validation_resources tests.test_windows_camera_probe tests.test_windows_camera_cli tests.test_worker_ownership tests.test_saved_camera_inputs tests.test_full_s_failure_capture -v
      - name: Real read-only Windows inventory, never a GPU PASS
        run: python -I -S -B scripts/run_laptop_validation.py --mode inventory --out output/windows-inventory
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-readonly-inventory-${{ github.run_id }}
          path: output/windows-inventory/
          if-no-files-found: error
          retention-days: 30
