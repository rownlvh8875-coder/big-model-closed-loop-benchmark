name: Fixed-pose native MetaDrive camera determinism diagnostic (SIM ONLY)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/camera-stability.yml'
      - 'scripts/metadrive_camera_stability.py'
      - 'bigbench/panda_clock.py'
      - 'bigbench/metadrive_camera.py'
      - 'bigbench/frame_stability.py'
      - 'tests/test_frame_stability.py'
permissions:
  contents: read
jobs:
  fixed-pose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYOPENGL_PLATFORM: 'glx'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa libegl1 libx11-6
          python -m pip install 'numpy>=1.26,<3' 'opencv-python-headless>=4.8' 'metadrive-simulator==0.4.3'
      - name: Verify official MetaDrive assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/md-assets"
          gh release download MetaDrive-0.4.3 --repo metadriverse/metadrive --pattern assets.zip --dir "$RUNNER_TEMP/md-assets"
          python - <<'PYCODE'
          import hashlib,metadrive,os
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          p=Path(os.environ['RUNNER_TEMP'])/'md-assets'/'assets.zip'
          assert p.stat().st_size==134074203
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='4f0da9f5143a1258131c5b55f77bdf170c0f9bce8a9f18dd41b3678df779eac9'
          with ZipFile(p) as z:
              for name in z.namelist():
                  n=PurePosixPath(name)
                  assert not n.is_absolute() and '..' not in n.parts
              z.extractall(Path(metadrive.__file__).resolve().parent)
          PYCODE
      - name: Repeat actual MetaDrive camera WITHOUT default ego visual obstruction
        run: |
          xvfb-run -a python -m scripts.metadrive_camera_stability \
            --seed 20261109 --frames 12 --hide-ego-rgb --pixel-audit --warmup 2 --save-frames --out output/default-clock-camera.json
          xvfb-run -a python -m scripts.metadrive_camera_stability \
            --seed 20261109 --frames 12 --fixed-clock --hide-ego-rgb --pixel-audit --warmup 2 --save-frames --out output/fixed-panda-clock-camera.json
      - name: Preserve non-scoring camera time dependence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-pose-camera-repeatability
          path: |
            output/*-clock-camera.json
            output/*-clock-camera_frames/*.png
          if-no-files-found: warn
          retention-days: 7
