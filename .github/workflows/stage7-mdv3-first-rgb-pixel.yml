name: Stage7 opt-in CPU source RGB first pixel divergence on original PSSM MD-V3 (SIM ONLY)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stage7-mdv3-first-rgb-pixel.yml'
      - 'scripts/native_mdv3_rgb_pixel_capture.py'
      - 'scripts/compare_native_mdv3_rgb_pixels.py'
      - 'scripts/aggregate_native_mdv3_rgb_pixel_matrix.py'
      - 'tests/test_native_mdv3_rgb_pixel_probe.py'
permissions:
  contents: read
concurrency:
  group: stage7-mdv3-pixel-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-pssm-rgb-pixel-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [20261109, 20261110]
        scenario: [s_curve_left_right, s_curve_right_left]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYOPENGL_PLATFORM: 'glx'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned MetaDrive 0.4.3 and official ONNX Runtime inference
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa libegl1 libx11-6
          python -m pip install '.[inference]' 'metadrive-simulator==0.4.3'
      - name: Verify official native MetaDrive rendering asset SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/metadrive-assets"
          gh release download MetaDrive-0.4.3 --repo metadriverse/metadrive --pattern assets.zip --dir "$RUNNER_TEMP/metadrive-assets"
          python - <<'PYCODE'
          import hashlib,metadrive,os
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          z=Path(os.environ['RUNNER_TEMP'])/'metadrive-assets'/'assets.zip'
          assert z.stat().st_size==134074203
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='4f0da9f5143a1258131c5b55f77bdf170c0f9bce8a9f18dd41b3678df779eac9'
          with ZipFile(z) as archive:
              for member in archive.namelist():
                  p=PurePosixPath(member)
                  if p.is_absolute() or '..' in p.parts:
                      raise ValueError('unsafe original MetaDrive asset entry')
              archive.extractall(Path(metadrive.__file__).resolve().parent)
          print('ORIGINAL_MDV3_METADRIVE_043_SHA256_CONFIRMED')
          PYCODE
      - name: Test exact source-RGB original input and byte-archive validation
        run: |
          python -m unittest discover -s tests -p 'test_fresh_native_mdv3.py' -v
          python -m unittest discover -s tests -p 'test_native_mdv3_rgb_pixel_probe.py' -v
      - name: Download original official MD-V3 ONNX into ephemeral runner with exact SHA256
        run: |
          python -m scripts.hf_models download \
            --path '1365126a-e71e-4778-be00-8ab92dc82c09/12864/big_driving_supercombo.onnx' \
            --sha256 '35976b11be3904eb78e32f7dc55a6abf8e9433ac5aa391a1998f1e9ce001b199' \
            --max-bytes 900000000 --out "$RUNNER_TEMP/models"
      - name: Two independent untouched-PSSM MD-V3 inference sessions with optional CPU RGB retention
        run: |
          set -euo pipefail
          root="output/stage7-rgb-pixels/seed-${{ matrix.seed }}/${{ matrix.scenario }}"
          mkdir -p "$root"
          for idx in 0 1; do
            echo "OFFICIAL_ORIGINAL_MDV3_NATIVE_START repeat=$idx seed=${{ matrix.seed }} scene=${{ matrix.scenario }}"
            xvfb-run -a python -m scripts.native_mdv3_repeat_trial \
              --model "$RUNNER_TEMP/models/1365126a-e71e-4778-be00-8ab92dc82c09/12864/big_driving_supercombo.onnx" \
              --spec model_specs/md-v3.json \
              --scenario ${{ matrix.scenario }} \
              --seed ${{ matrix.seed }} --steps 12 --speed 8 \
              --initial-fraction 0.12 \
              --raw-rgb-dir "$root/rgb_run_${idx}" \
              --out "$root/run_${idx}.json"
          done
          python -m scripts.compare_fresh_native_mdv3 --root "$root"
          python -m scripts.compare_native_mdv3_rgb_pixels --root "$root"
      - name: Archive lossless original RGB bytes, pixel masks and raw ONNX feedback trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-rgb-pixels-${{ matrix.seed }}-${{ matrix.scenario }}
          path: output/stage7-rgb-pixels/
          retention-days: 7
          if-no-files-found: warn
  independently-revalidate-four-source-rgb-archives:
    needs: original-pssm-rgb-pixel-trial
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install postprocess-only array and image-mask dependencies
        run: python -m pip install 'numpy>=1.26' 'opencv-python-headless>=4.8'
      - name: Download 4 independent raw CPU source RGB + ONNX SHA artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stage7-rgb-pixels-*
          path: output/stage7-rgb-pixels/
          merge-multiple: true
      - name: Recheck every source pixel byte against original model-trace SHA
        run: |
          python -m scripts.aggregate_native_mdv3_rgb_pixel_matrix \
            --root output/stage7-rgb-pixels \
            --out output/stage7-rgb-pixels/four_scene_pixel_summary.json
      - name: Save independent four-case recomputation summary
        uses: actions/upload-artifact@v4
        with:
          name: stage7-original-mdv3-source-rgb-pixel-summary
          path: output/stage7-rgb-pixels/four_scene_pixel_summary.json
          retention-days: 7
          if-no-files-found: error
