name: Experimental MD-V3 pixel-bounded camera repeatability (SIM ONLY)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/model-camera-repeat.yml'
      - 'scripts/run_same_model_repeat.py'
      - 'bigbench/camera_convergence.py'
      - 'tests/test_camera_convergence.py'
permissions:
  contents: read
jobs:
  strict-model-repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYOPENGL_PLATFORM: 'glx'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenGL and pinned MetaDrive / ONNX dependencies
        run: |
          python - <<'PYCODE'
          import json, os
          names=('HTTP_PROXY','HTTPS_PROXY','http_proxy','https_proxy','NO_PROXY','no_proxy',
                 'SSL_CERT_FILE','SSL_CERT_DIR','REQUESTS_CA_BUNDLE','CURL_CA_BUNDLE')
          print('NATIVE_CI_INSTALL_ROUTE_PRESENCE',json.dumps({name:{'defined':name in os.environ,'nonempty':bool(os.environ.get(name))} for name in names}))
          print('NATIVE_CI_SCOPED_HELPER_PRESENT',os.access('/usr/local/bin/cloud-agent-packages',os.X_OK))
          PYCODE
          # Retain explicit lowercase settings, including intentionally empty ones.
          if [[ ! -v http_proxy && -v HTTP_PROXY ]]; then export http_proxy="$HTTP_PROXY"; fi
          if [[ ! -v https_proxy && -v HTTPS_PROXY ]]; then export https_proxy="$HTTPS_PROXY"; fi
          if [[ ! -v no_proxy && -v NO_PROXY ]]; then export no_proxy="$NO_PROXY"; fi
          native_ci_sudo=(sudo -n --preserve-env=HTTP_PROXY,HTTPS_PROXY,http_proxy,https_proxy,NO_PROXY,no_proxy,SSL_CERT_FILE,SSL_CERT_DIR,REQUESTS_CA_BUNDLE,CURL_CA_BUNDLE)
          if [[ -x /usr/local/bin/cloud-agent-packages ]]; then
            "${native_ci_sudo[@]}" /usr/local/bin/cloud-agent-packages update
            "${native_ci_sudo[@]}" /usr/local/bin/cloud-agent-packages install xvfb libgl1 libglu1-mesa libegl1 libx11-6
          else
            "${native_ci_sudo[@]}" apt-get -o APT::Update::Error-Mode=any update
            "${native_ci_sudo[@]}" apt-get install -y xvfb libgl1 libglu1-mesa libegl1 libx11-6
          fi
          python -m pip install '.[inference]' 'metadrive-simulator==0.4.3'
      - name: Verify official native simulator assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/metadrive-asset"
          gh release download MetaDrive-0.4.3 --repo metadriverse/metadrive --pattern assets.zip --dir "$RUNNER_TEMP/metadrive-asset"
          python - <<'PYCODE'
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          import hashlib,metadrive,os
          z=Path(os.environ['RUNNER_TEMP'])/'metadrive-asset'/'assets.zip'
          assert z.stat().st_size==134074203
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='4f0da9f5143a1258131c5b55f77bdf170c0f9bce8a9f18dd41b3678df779eac9'
          with ZipFile(z) as src:
              for name in src.namelist():
                  p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise ValueError('unsafe simulator asset filename')
              src.extractall(Path(metadrive.__file__).resolve().parent)
          print('METADRIVE_043_ASSET_HASH_VERIFIED')
          PYCODE
      - name: Download sha-pinned official MD-V3 to ephemeral runner
        run: |
          python -m scripts.hf_models download \
            --path '1365126a-e71e-4778-be00-8ab92dc82c09/12864/big_driving_supercombo.onnx' \
            --sha256 '35976b11be3904eb78e32f7dc55a6abf8e9433ac5aa391a1998f1e9ce001b199' \
            --max-bytes 900000000 --out "$RUNNER_TEMP/models"
      - name: Independent 12-step ONNX repeat with bounded RGB tolerances, never image rewriting
        run: |
          xvfb-run -a python -m scripts.run_same_model_repeat \
            --model "$RUNNER_TEMP/models/1365126a-e71e-4778-be00-8ab92dc82c09/12864/big_driving_supercombo.onnx" \
            --spec model_specs/md-v3.json --scenario s_curve_left_right \
            --seed 20261109 --steps 12 --speed 8 --camera-convergence 6 \
            --camera-pixel-tolerance 16 --camera-channel-delta 10 \
            --out output/strict-native-repeat
      - name: Verify complete public MD-V3 action bindings without another inference
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          root=Path('output/strict-native-repeat')
          for repeat in (0,1):
              report=json.loads((root/f'run_{repeat}.json').read_text())
              binding=report['public_action_frame']
              sidecar=json.loads((root/f'run_{repeat}_action_frame_binding.json').read_text())
              assert sidecar['episode_error'] is None and sidecar['episode_error_chain']==[]
              assert {k:v for k,v in sidecar.items() if k not in ('episode_error','episode_error_chain')}==binding
              assert report['status']=='DIAGNOSTIC_EXECUTED' and report['requested_steps']==report['completed_steps']==12
              assert binding['protocol']=='public-onnx-action-frame-v1'
              assert binding['identity']['model_sha256']=='35976b11be3904eb78e32f7dc55a6abf8e9433ac5aa391a1998f1e9ce001b199'
              assert binding['identity']['model_nbytes']==768750198
              assert binding['identity']['spec_sha256']=='689f4d80082070b08ff35920e37d7070e811dfb42a279909751f79e900c735e2'
              assert binding['provenance']=='VERIFIED_OFFICIAL_IDENTITY' and binding['source_basis_verified'] is True
              assert binding['parent_action_frame']=='MODEL_BODY_FRD'
              assert binding['applied_action_frame']=='INTEGRATOR_BODY_FLU_WORLD_CCW' and binding['rotation_applied'] is True
              assert binding['total_executed_model_calls'] is None and binding['episode_completion_inferred'] is False
              assert binding['parent_trace_count']==binding['bridge_receipt_count']==12
              assert len(binding['parent_trace'])==len(binding['bridge_receipts'])==len(report['frames'])==12
              for index,(parent,bridge,frame) in enumerate(zip(binding['parent_trace'],binding['bridge_receipts'],report['frames'])):
                  source,world=bridge['parent_model_action'],bridge['applied_world_action']
                  assert parent['step_index']==index and bridge['step']==index+1
                  assert source['curvature_1pm']==parent['curvature_1pm']
                  assert world['curvature_1pm']==-source['curvature_1pm']
                  assert world['acceleration_mps2']==source['acceleration_mps2']==parent['raw_longitudinal_accel_mps2']
                  assert frame['desired_curvature_1pm']==world['curvature_1pm']
                  assert frame['desired_acceleration_mps2']==world['acceleration_mps2']
          print('PUBLIC_MDV3_BINDING_RECEIPTS_VERIFIED_NO_EXTRA_MODEL_CALLS')
          PYCODE
      - name: Preserve both receipts and repeated-run result even on mismatch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-strict-native-onnx-repeat
          path: output/strict-native-repeat/
          if-no-files-found: warn
          retention-days: 7
