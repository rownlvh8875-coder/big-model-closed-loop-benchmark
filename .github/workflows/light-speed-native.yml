name: Official Light Speed big ONNX + MetaDrive camera I/O (SIM ONLY)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/light-speed-native.yml'
permissions:
  contents: read
jobs:
  light-speed-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYOPENGL_PLATFORM: 'glx'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install virtual OpenGL and ONNX Runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa libegl1 libx11-6
          python -m pip install '.[inference]' 'metadrive-simulator==0.4.3'
      - name: Verify and unpack official MetaDrive assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/metadrive-assets"
          gh release download MetaDrive-0.4.3 --repo metadriverse/metadrive --pattern assets.zip --dir "$RUNNER_TEMP/metadrive-assets"
          python - <<'PYCODE'
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          import hashlib,metadrive,os
          z=Path(os.environ['RUNNER_TEMP'])/'metadrive-assets'/'assets.zip'
          assert z.stat().st_size==134074203
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='4f0da9f5143a1258131c5b55f77bdf170c0f9bce8a9f18dd41b3678df779eac9'
          with ZipFile(z) as a:
              for n in a.namelist():
                  p=PurePosixPath(n)
                  assert not p.is_absolute() and '..' not in p.parts
              a.extractall(Path(metadrive.__file__).resolve().parent)
          print('METADRIVE_043_ASSETS_VERIFIED')
          PYCODE
      - name: Download official SHA-pinned Light Speed ONNX
        run: |
          python -m scripts.hf_models download \
            --path 'f22b8b34-0983-4185-a453-a87b73798d61/16384/big_driving_supercombo.onnx' \
            --sha256 '6274eb4a3f3eb7ad1ab341d222bbba2ba709b06645dbbd15ac4971d6cb22ab21' \
            --max-bytes 900000000 --out "$RUNNER_TEMP/models"
      - name: Run actual Light Speed model on changing native virtual camera frames
        run: |
          xvfb-run -a python -m scripts.metadrive_optical_check \
            --model "$RUNNER_TEMP/models/f22b8b34-0983-4185-a453-a87b73798d61/16384/big_driving_supercombo.onnx" \
            --spec model_specs/light-speed.json --model-action-frame model-frd --steps 5 \
            --out output/light-speed-native
          python - <<'PYCODE'
          import json
          from pathlib import Path
          a=json.loads(Path('output/light-speed-native/optical_report.json').read_text())
          assert a['model_inference_steps']==5 and a['scoring_allowed'] is False
          assert a['real_vehicle_testing'] is False and a['cd210_fallback'] is False
          binding=a['public_action_frame']
          assert binding['provenance']=='USER_DECLARATION' and binding['source_basis_verified'] is False
          assert binding['requested_frame']=='model-frd'
          assert binding['parent_action_frame']=='MODEL_BODY_FRD'
          assert binding['applied_action_frame']=='INTEGRATOR_BODY_FLU_WORLD_CCW' and binding['rotation_applied'] is True
          assert binding['parent_trace_count']==binding['bridge_receipt_count']==len(a['records'])==5
          print('OFFICIAL_LIGHT_SPEED_NATIVE_INPUT_PASS',a['model_inference_steps'])
          PYCODE
      - name: Archive only non-scoring diagnostic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-light-speed-native-input-diagnostics
          path: output/light-speed-native/
          if-no-files-found: warn
          retention-days: 7
