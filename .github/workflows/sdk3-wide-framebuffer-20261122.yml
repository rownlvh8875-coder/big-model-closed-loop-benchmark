name: SDK3 wide final framebuffer and RAM
on:
  push:
    branches: ['diagnostic/sdk3-wide-framebuffer-20261122-01']
    paths: ['docs/requests/sdk3-wide-framebuffer-20261122-01.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: stage7-official-model-execution
  cancel-in-progress: false
jobs:
  camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned offline pixel readers
        run: python -m pip install --no-deps numpy==2.4.6 opencv-python-headless==5.0.0.93
      - name: Compare two owned native camera processes on one runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -B scripts/run_sdk3_wide_framebuffer.py
      - name: Preserve completed and failed capture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wide-framebuffer-step44-20261122
          path: output/sdk3-wide-framebuffer-20261122/bundle/
          if-no-files-found: error
          retention-days: 30
