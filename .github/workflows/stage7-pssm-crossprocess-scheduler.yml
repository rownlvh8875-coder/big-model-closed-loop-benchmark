name: Stage7 original PSSM vs task-removal independent-process camera timing A-B (SIM ONLY)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stage7-pssm-crossprocess-scheduler.yml'
      - 'scripts/native_raw_pixel_clock.py'
      - 'scripts/compare_native_pssm_cross_process.py'
      - 'tests/test_native_pssm_cross_process.py'
permissions:
  contents: read
concurrency:
  group: stage7-crossprocess-pssm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  crossprocess-native-pssm-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [20261109, 20261110]
        scenario: [s_curve_left_right, s_curve_right_left]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYOPENGL_PLATFORM: 'glx'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native simulator and CPU OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa libegl1 libx11-6
          python -m pip install 'numpy>=1.26,<3' 'opencv-python-headless>=4.8' 'metadrive-simulator==0.4.3'
      - name: Verify upstream official 0.4.3 rendering assets SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-assets"
          gh release download MetaDrive-0.4.3 --repo metadriverse/metadrive --pattern assets.zip --dir "$RUNNER_TEMP/native-assets"
          python - <<'PYCODE'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import hashlib, os, metadrive
          z=Path(os.environ['RUNNER_TEMP'])/'native-assets'/'assets.zip'
          assert z.stat().st_size==134074203
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='4f0da9f5143a1258131c5b55f77bdf170c0f9bce8a9f18dd41b3678df779eac9'
          with ZipFile(z) as src:
              for name in src.namelist():
                  p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise ValueError('unsafe official MetaDrive archive path')
              src.extractall(Path(metadrive.__file__).resolve().parent)
          print('OFFICIAL_METADRIVE_ASSETS_CONFIRMED')
          PYCODE
      - name: Test native cross-process camera/PSSM SHA evidence contract
        run: |
          python -m unittest discover -s tests -p 'test_native_pssm_cross_process.py' -v
      - name: Eight independent native Panda image sequences per seed and scene
        run: |
          set -euo pipefail
          root="output/stage7-pssm-crossprocess/seed-${{ matrix.seed }}/${{ matrix.scenario }}"
          mkdir -p "$root"
          for arm in sequential_original paired_original sequential_pssm_task_removed paired_pssm_task_removed; do
            case "$arm" in
              sequential_original) mode="perceive_sequential"; ablation="baseline";;
              paired_original) mode="task_step_pair"; ablation="baseline";;
              sequential_pssm_task_removed) mode="perceive_sequential"; ablation="shadow_off";;
              paired_pssm_task_removed) mode="task_step_pair"; ablation="shadow_off";;
              *) echo "INVALID_NATIVE_ARM"; exit 12;;
            esac
            for idx in 0 1; do
              file="$root/${arm}-run_${idx}.json"
              echo "STAGE7_NATIVE_CROSSPROCESS_START seed=${{ matrix.seed }} scene=${{ matrix.scenario }} arm=$arm repeat=$idx"
              rc=0
              xvfb-run -a python -m scripts.native_raw_pixel_clock \
                --seed ${{ matrix.seed }} --scenario ${{ matrix.scenario }} \
                --fraction 0.12 --mode "$mode" --ablation "$ablation" \
                --frames 10 --warmup 2 --out "$file" || rc=$?
              if [ "$rc" -eq 5 ]; then
                test -s "$file" || exit 5
                python -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert d.get("status")=="OBSERVED_NATIVE_PIXEL_CLOCK" and d.get("mode")==sys.argv[2] and d.get("ablation")==sys.argv[3] and d.get("process_uuid")' "$file" "$mode" "$ablation"
              elif [ "$rc" -ne 0 ]; then
                echo "INVALID_STAGE7_NATIVE_CROSSPROCESS rc=$rc"
                exit "$rc"
              fi
            done
          done
          python -m scripts.compare_native_pssm_cross_process \
            --mode case --root output/stage7-pssm-crossprocess \
            --seed ${{ matrix.seed }} --scene ${{ matrix.scenario }} \
            --out "$root/case_comparison.json"
      - name: Preserve raw original and experimental native frame SHA series
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-pssm-crossprocess-${{ matrix.seed }}-${{ matrix.scenario }}
          path: output/stage7-pssm-crossprocess/
          retention-days: 7
          if-no-files-found: warn
  independent-four-scene-pssm-aggregate:
    needs: crossprocess-native-pssm-camera
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SHA receipt dependencies
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Download full raw receipts for four real native scenes
        uses: actions/download-artifact@v4
        with:
          pattern: stage7-pssm-crossprocess-*
          path: output/stage7-pssm-crossprocess/
          merge-multiple: true
      - name: Recompute independent 32-process SHA summaries
        run: |
          python -m unittest discover -s tests -p 'test_native_pssm_cross_process.py' -v
          python -m scripts.compare_native_pssm_cross_process \
            --mode aggregate --root output/stage7-pssm-crossprocess \
            --out output/stage7-pssm-crossprocess/aggregate_summary.json
      - name: Archive independent final original-vs-experimental summary
        uses: actions/upload-artifact@v4
        with:
          name: stage7-pssm-crossprocess-fourscene-summary
          path: output/stage7-pssm-crossprocess/aggregate_summary.json
          retention-days: 7
          if-no-files-found: error
