name: Trace original SDK3 draw boundaries after tiny GPU qualification
on:
  push:
    branches: ['diagnostic/sdk3-draw-trace-20261117-02']
    paths: ['docs/requests/sdk3-draw-trace-20261117-02.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: sdk3-draw-trace-20261117-02
  cancel-in-progress: false
jobs:
  draw-trace:
    name: SDK3 original draw trace
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host-only raw-image analysis
        run: python -m pip install --no-deps numpy==1.26.4
      - name: Qualify tiny GPU then observe OFF and ON original scene
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -B scripts/run_sdk3_draw_trace.py --run
      - name: Retain all actual evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk3-draw-trace-20261117-02
          path: output/stage7-sdk3-draw-trace-02/producer/bundle/
          retention-days: 30
          compression-level: 6
          include-hidden-files: true
          if-no-files-found: error
