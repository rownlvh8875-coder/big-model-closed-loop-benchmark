name: Stage7 PSSM sampler type and effective GPU comparison state (SIM ONLY)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stage7-shadow-sampler.yml'
      - 'scripts/metadrive_render_causality.py'
      - 'scripts/native_raw_pixel_clock.py'
      - 'scripts/native_shadow_sampler_probe.py'
      - 'scripts/compare_native_pssm_cross_process.py'
      - 'scripts/compare_native_capture_schedule.py'
      - 'scripts/compare_native_shadow_sampler.py'
      - 'scripts/run_native_shadow_sampler_trial.py'
      - 'tests/test_shadow_sampler_probe.py'
      - 'tests/test_native_shadow_sampler.py'
permissions:
  contents: read
concurrency:
  group: stage7-shadow-sampler-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-shadow-sampler:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [20261109, 20261110]
        scenario: [s_curve_left_right, s_curve_right_left]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYOPENGL_PLATFORM: 'glx'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native simulator and CPU OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa libegl1 libx11-6
          python -m pip install 'numpy>=1.26,<3' 'opencv-python-headless>=4.8' 'metadrive-simulator==0.4.3'
      - name: Verify upstream official 0.4.3 rendering assets SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-assets"
          gh release download MetaDrive-0.4.3 --repo metadriverse/metadrive --pattern assets.zip --dir "$RUNNER_TEMP/native-assets"
          python - <<'PYCODE'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import hashlib, os, metadrive
          z=Path(os.environ['RUNNER_TEMP'])/'native-assets'/'assets.zip'
          assert z.stat().st_size==134074203
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='4f0da9f5143a1258131c5b55f77bdf170c0f9bce8a9f18dd41b3678df779eac9'
          with ZipFile(z) as src:
              for name in src.namelist():
                  p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise ValueError('unsafe official MetaDrive archive path')
              src.extractall(Path(metadrive.__file__).resolve().parent)
          print('OFFICIAL_METADRIVE_ASSETS_CONFIRMED')
          PYCODE
      - name: Test strict sampler and GPU binding receipt contracts
        run: |
          python -m unittest discover -s tests -p 'test_shadow_sampler_probe.py' -v
          python -m unittest discover -s tests -p 'test_native_shadow_sampler.py' -v
      - name: Eight independent native Panda image sequences per seed and scene
        run: |
          set -euo pipefail
          root="output/stage7-shadow-sampler/seed-${{ matrix.seed }}/${{ matrix.scenario }}"
          mkdir -p "$root"
          for arm in original_off original_probe raw_linear_off raw_linear_probe; do
            for idx in 0 1; do
              file="$root/${arm}-run_${idx}.json"
              echo "NATIVE_SHADOW_SAMPLER_START seed=${{ matrix.seed }} scene=${{ matrix.scenario }} arm=$arm repeat=$idx"
              python -m scripts.run_native_shadow_sampler_trial \
                --seed ${{ matrix.seed }} --scene ${{ matrix.scenario }} \
                --arm "$arm" --out "$file"
            done
          done
          python -m scripts.compare_native_shadow_sampler \
            --mode case --root output/stage7-shadow-sampler \
            --seed ${{ matrix.seed }} --scene ${{ matrix.scenario }} \
            --out "$root/case_comparison.json"
      - name: Preserve all raw source, warped RGB, I420, clock and task receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-shadow-sampler-${{ matrix.seed }}-${{ matrix.scenario }}
          path: output/stage7-shadow-sampler/
          retention-days: 7
          if-no-files-found: warn
  independent-sampler-aggregate:
    needs: native-shadow-sampler
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SHA receipt dependencies
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Download full raw receipts for four real native scenes
        uses: actions/download-artifact@v4
        with:
          pattern: stage7-shadow-sampler-*
          path: output/stage7-shadow-sampler/
          merge-multiple: true
      - name: Recompute independent 32-process SHA summaries
        run: |
          python -m unittest discover -s tests -p 'test_native_shadow_sampler.py' -v
          python -m scripts.compare_native_shadow_sampler \
            --mode aggregate --root output/stage7-shadow-sampler \
            --out output/stage7-shadow-sampler/aggregate_summary.json
      - name: Archive independently recomputed sampler binding and image summary
        uses: actions/upload-artifact@v4
        with:
          name: stage7-shadow-sampler-fourscene-summary
          path: output/stage7-shadow-sampler/aggregate_summary.json
          retention-days: 7
          if-no-files-found: error
