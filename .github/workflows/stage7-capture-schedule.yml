name: Stage7 camera order versus shared-mount tick isolation (SIM ONLY)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/stage7-capture-schedule.yml'
      - 'scripts/metadrive_render_causality.py'
      - 'scripts/native_raw_pixel_clock.py'
      - 'scripts/compare_native_pssm_cross_process.py'
      - 'scripts/compare_native_capture_schedule.py'
      - 'tests/test_capture_schedule_isolation.py'
      - 'tests/test_native_capture_schedule.py'
permissions:
  contents: read
concurrency:
  group: stage7-camera-order-ticks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-camera-order-ticks:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [20261109, 20261110]
        scenario: [s_curve_left_right, s_curve_right_left]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYOPENGL_PLATFORM: 'glx'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native simulator and CPU OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa libegl1 libx11-6
          python -m pip install 'numpy>=1.26,<3' 'opencv-python-headless>=4.8' 'metadrive-simulator==0.4.3'
      - name: Verify upstream official 0.4.3 rendering assets SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-assets"
          gh release download MetaDrive-0.4.3 --repo metadriverse/metadrive --pattern assets.zip --dir "$RUNNER_TEMP/native-assets"
          python - <<'PYCODE'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import hashlib, os, metadrive
          z=Path(os.environ['RUNNER_TEMP'])/'native-assets'/'assets.zip'
          assert z.stat().st_size==134074203
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='4f0da9f5143a1258131c5b55f77bdf170c0f9bce8a9f18dd41b3678df779eac9'
          with ZipFile(z) as src:
              for name in src.namelist():
                  p=PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise ValueError('unsafe official MetaDrive archive path')
              src.extractall(Path(metadrive.__file__).resolve().parent)
          print('OFFICIAL_METADRIVE_ASSETS_CONFIRMED')
          PYCODE
      - name: Test capture scheduling and strict receipt contracts
        run: |
          python -m unittest discover -s tests -p 'test_capture_schedule_isolation.py' -v
          python -m unittest discover -s tests -p 'test_native_capture_schedule.py' -v
      - name: Eight independent native Panda image sequences per seed and scene
        run: |
          set -euo pipefail
          root="output/stage7-capture-schedule/seed-${{ matrix.seed }}/${{ matrix.scenario }}"
          mkdir -p "$root"
          for arm in sequential_road_first sequential_wide_first paired_one_tick paired_two_ticks; do
            case "$arm" in
              sequential_road_first) mode="perceive_sequential";;
              sequential_wide_first) mode="perceive_reverse";;
              paired_one_tick) mode="task_step_pair";;
              paired_two_ticks) mode="task_step_pair_twice";;
              *) echo "INVALID_NATIVE_SCHEDULE"; exit 12;;
            esac
            for idx in 0 1; do
              file="$root/${arm}-run_${idx}.json"
              echo "NATIVE_CAPTURE_ORDER_TICK_START seed=${{ matrix.seed }} scene=${{ matrix.scenario }} arm=$arm repeat=$idx"
              xvfb-run -a python -m scripts.native_raw_pixel_clock \
                --seed ${{ matrix.seed }} --scenario ${{ matrix.scenario }} \
                --fraction 0.12 --mode "$mode" --ablation baseline \
                --frames 10 --warmup 2 --out "$file"
            done
          done
          python -m scripts.compare_native_capture_schedule \
            --mode case --root output/stage7-capture-schedule \
            --seed ${{ matrix.seed }} --scene ${{ matrix.scenario }} \
            --out "$root/case_comparison.json"
      - name: Preserve all raw source, warped RGB, I420, clock and task receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-capture-schedule-${{ matrix.seed }}-${{ matrix.scenario }}
          path: output/stage7-capture-schedule/
          retention-days: 7
          if-no-files-found: warn
  independent-camera-order-tick-aggregate:
    needs: native-camera-order-ticks
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SHA receipt dependencies
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Download full raw receipts for four real native scenes
        uses: actions/download-artifact@v4
        with:
          pattern: stage7-capture-schedule-*
          path: output/stage7-capture-schedule/
          merge-multiple: true
      - name: Recompute independent 32-process SHA summaries
        run: |
          python -m unittest discover -s tests -p 'test_native_capture_schedule.py' -v
          python -m scripts.compare_native_capture_schedule \
            --mode aggregate --root output/stage7-capture-schedule \
            --out output/stage7-capture-schedule/aggregate_summary.json
      - name: Archive independently recomputed capture-order and tick summary
        uses: actions/upload-artifact@v4
        with:
          name: stage7-capture-schedule-fourscene-summary
          path: output/stage7-capture-schedule/aggregate_summary.json
          retention-days: 7
          if-no-files-found: error
