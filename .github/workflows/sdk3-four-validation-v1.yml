name: Four validation native full-S and virtual optics with explicit external gates
on:
  push:
    branches: ['diagnostic/sdk3-four-validation-20261118-01']
    paths: ['docs/requests/sdk3-four-validation-20261118-01.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: sdk3-four-validation-20261118-01
  cancel-in-progress: false
jobs:
  native-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      admitted: ${{ steps.probe.outputs.admitted }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_sha: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host-only evidence readers
        run: python -m pip install --no-deps numpy==1.26.4 opencv-python-headless==4.11.0.86
      - name: Authenticate source then measure four native geometry optical and rate cases
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -B scripts/run_sdk3_four_validation.py --run --phase probe
      - name: Retain all positive and negative zero-model evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk3-four-validation-probe-20261118-01
          path: output/stage7-four-validation-01/probe/producer/bundle/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
  full-s:
    name: Full S ${{ matrix.seed }} ${{ matrix.scenario }}
    needs: native-probe
    if: needs.native-probe.outputs.admitted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [20261109, 20261110]
        scenario: [s_curve_left_right, s_curve_right_left]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host-only evidence readers
        run: python -m pip install --no-deps numpy==1.26.4 opencv-python-headless==4.11.0.86
      - name: Stage explicit ORT dependencies outside frozen image
        env:
          SDK3_MODEL_DEPS: ${{ runner.temp }}/sdk3-four-model-deps
        run: |
          python -m pip install --no-deps --target "$SDK3_MODEL_DEPS" \
            onnxruntime==1.20.1 flatbuffers==24.3.25 coloredlogs==15.0.1 \
            humanfriendly==10.0 packaging==24.2 protobuf==5.29.5 \
            sympy==1.13.3 mpmath==1.3.0
      - name: Independently validate native admission then attempt two unassisted full-S runs
        env:
          GH_TOKEN: ${{ github.token }}
          SDK3_MODEL_DEPS: ${{ runner.temp }}/sdk3-four-model-deps
          FOUR_PROBE_ARTIFACT_ID: ${{ needs.native-probe.outputs.artifact_id }}
          FOUR_PROBE_ARTIFACT_SHA: ${{ needs.native-probe.outputs.artifact_sha }}
        run: python -I -B scripts/run_sdk3_four_validation.py --run --phase full-s --seed '${{ matrix.seed }}' --scenario '${{ matrix.scenario }}'
      - name: Retain all actual full-S outcomes, never model weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk3-four-validation-full-s-20261118-01-${{ matrix.seed }}-${{ matrix.scenario }}
          path: output/stage7-four-validation-01/${{ matrix.seed }}-${{ matrix.scenario }}/producer/bundle/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
