name: MetaDrive single-stage GPU readback interference A-B (DIAGNOSTIC ONLY)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gpu-probe-interference.yml'
      - 'scripts/aggregate_probe_interventions.py'
      - 'tests/test_probe_interventions.py'
permissions:
  contents: read
jobs:
  probe-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [20261109, 20261110]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYOPENGL_PLATFORM: 'glx'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MetaDrive 0.4.3 and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa libegl1 libx11-6
          python -m pip install 'numpy>=1.26,<3' 'opencv-python-headless>=4.8' 'metadrive-simulator==0.4.3'
      - name: Pin and verify official MetaDrive release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/md-assets"
          gh release download MetaDrive-0.4.3 --repo metadriverse/metadrive --pattern assets.zip --dir "$RUNNER_TEMP/md-assets"
          python - <<'PYCODE'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import hashlib, metadrive, os
          p=Path(os.environ['RUNNER_TEMP'])/'md-assets'/'assets.zip'
          assert p.stat().st_size==134074203
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='4f0da9f5143a1258131c5b55f77bdf170c0f9bce8a9f18dd41b3678df779eac9'
          with ZipFile(p) as z:
              for n in z.namelist():
                  q=PurePosixPath(n)
                  if q.is_absolute() or '..' in q.parts:
                      raise ValueError('unsafe zip entry')
              z.extractall(Path(metadrive.__file__).resolve().parent)
          print('OFFICIAL_ASSETS_PIN_VERIFIED')
          PYCODE
      - name: Verify probe results schema does not imply driving-model PASS
        run: |
          python -m unittest discover -s tests -p 'test_probe_interventions.py' -v
          python -m unittest discover -s tests -p 'test_hdr_trace.py' -v
      - name: One independent Python Xvfb environment per GPU stage
        run: |
          set -euo pipefail
          root="output/probe-intervention/seed-${{ matrix.seed }}"
          mkdir -p "$root"
          for stage in none pssm_depth road_hdr wide_hdr all; do
            echo "NATIVE_PROBE_BEGIN stage=$stage seed=${{ matrix.seed }}"
            status_code=0
            xvfb-run -a python -m scripts.metadrive_hdr_trace \
              --seed ${{ matrix.seed }} --pose-id origin \
              --frames 6 --warmup 2 --ablation baseline \
              --probe-stage "$stage" --out "$root/$stage.json" || status_code=$?
            if [ "$status_code" -eq 5 ]; then
              # xvfb-run can return 5 on teardown even after Python wrote the
              # finished JSON. Fail closed if there is no complete receipt.
              echo "XVFB_TEARDOWN_EXIT_5 stage=$stage; validating saved receipt"
              test -s "$root/$stage.json" || exit 5
              python -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert d.get("probe_stage")==sys.argv[2] and d.get("required_probe_buffers_available") is True and d.get("status") in ("OBSERVED_SELECTIVE_PROBE", "GPU_PROBE_INTERVENTION_OBSERVED", "OBSERVED_BUFFER_CHAIN")' "$root/$stage.json" "$stage"
            elif [ "$status_code" -ne 0 ] && [ "$status_code" -ne 2 ]; then
              echo "HARD_ERROR unexpected native process exit=$status_code"
              exit "$status_code"
            fi
          done
          # This may succeed even when the intervention is observed: not model PASS.
          python -m scripts.aggregate_probe_interventions --root "$root"
      - name: Preserve per-stage native receipts and scientific failure statuses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-probe-interference-seed-${{ matrix.seed }}
          path: output/probe-intervention/
          if-no-files-found: warn
          retention-days: 7
