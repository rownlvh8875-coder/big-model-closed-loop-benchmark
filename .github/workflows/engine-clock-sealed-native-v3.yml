name: One-use sealed-image native camera canary v3
on:
  push:
    branches: ['diagnostic/engine-clock-sealed-native-20261114-03']
permissions:
  contents: read
  actions: read
concurrency:
  group: engine-clock-sealed-native-20261114-03
  cancel-in-progress: false
jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Reject repeated attempts
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: test "$ATTEMPT" = 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate source and image; run one canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -I -S -B scripts/engine_clock_sealed_native_run_v3.py --run
      - name: Preserve original canary and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-clock-sealed-native-20261114-03
          path: |
            output/stage7-sealed-native/sealed-native-20261114-03/execution/
            !output/stage7-sealed-native/sealed-native-20261114-03/execution/cache/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
          include-hidden-files: true
